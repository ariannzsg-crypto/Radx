name: Build and Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version name to stamp into the APK (e.g. 1.0.0)"
        required: false
        default: ""

permissions:
  contents: write

env:
  SING_BOX_VERSION: v1.11.15
  XRAY_VERSION: v26.10.21
  NDK_VERSION: 27.0.12077973

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Source sanity checks
        run: node scripts/check_sources.js

      # The Xray core runs as its own process, so it ships as an executable named
      # libxray.so inside jniLibs (the only place Android lets an app execute from).
      - name: Fetch Xray core binaries
        run: |
          set -euo pipefail
          BASE="https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}"
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86_64
          curl -sSL --retry 3 -o "$RUNNER_TEMP/xray-arm64.zip" "$BASE/Xray-android-arm64-v8a.zip"
          curl -sSL --retry 3 -o "$RUNNER_TEMP/xray-x64.zip" "$BASE/Xray-android-amd64.zip"
          unzip -o -q "$RUNNER_TEMP/xray-arm64.zip" -d "$RUNNER_TEMP/xray-arm64"
          unzip -o -q "$RUNNER_TEMP/xray-x64.zip" -d "$RUNNER_TEMP/xray-x64"
          install -m 0755 "$RUNNER_TEMP/xray-arm64/xray" app/src/main/jniLibs/arm64-v8a/libxray.so
          install -m 0755 "$RUNNER_TEMP/xray-x64/xray" app/src/main/jniLibs/x86_64/libxray.so
          file app/src/main/jniLibs/arm64-v8a/libxray.so app/src/main/jniLibs/x86_64/libxray.so

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      # The ubuntu runner image already ships the Android SDK and cmdline-tools,
      # so only the missing packages have to be installed here.
      - name: Install SDK packages
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -1 || true)
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER=$(command -v sdkmanager || true); fi
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found under $SDK_ROOT"; exit 1; fi
          echo "Using $SDKMANAGER (SDK: $SDK_ROOT)"
          export PATH="$(dirname "$SDKMANAGER"):$PATH"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}"
          # sing-box's build script only checks that this license marker exists.
          mkdir -p "$SDK_ROOT/licenses"
          touch "$SDK_ROOT/licenses/android-sdk-license"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Cache libbox.aar
        id: libbox-cache
        uses: actions/cache@v4
        with:
          path: app/libs/libbox.aar
          key: libbox-${{ env.SING_BOX_VERSION }}

      - name: Build sing-box libbox.aar
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${SING_BOX_VERSION}" https://github.com/SagerNet/sing-box.git "$RUNNER_TEMP/sing-box"
          cd "$RUNNER_TEMP/sing-box"
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.4
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.4
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init
          go run ./cmd/internal/build_libbox -target android
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp libbox.aar "$GITHUB_WORKSPACE/app/libs/libbox.aar"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks
            {
              echo "storeFile=keystore.jks"
              echo "storePassword=${KEYSTORE_PASSWORD}"
              echo "keyAlias=${KEY_ALIAS}"
              echo "keyPassword=${KEY_PASSWORD}"
            } > keystore.properties
            echo "Using release signing key"
          else
            echo "::warning::KEYSTORE_BASE64 is not configured; the APK will be debug-signed"
          fi

      - name: Run unit tests
        run: bash ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Build release APK
        run: bash ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Name APK
        id: apk
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-v1.0.0}"
          if [ -n "${{ inputs.version }}" ]; then VERSION="v${{ inputs.version }}"; fi
          OUT="Radx-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: radx-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Extract changelog for the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          awk '/^## \[/ { if (found) exit; found = 1 } found' CHANGELOG.md > release-notes.md || true
          if [ ! -s release-notes.md ]; then cp CHANGELOG.md release-notes.md; fi
          cat release-notes.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Radx ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
          generate_release_notes: false

  # The desktop build reuses the app's config pipeline, so it ships the same sing-box and
  # Xray versions behind a command line tool.
  windows:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the desktop distribution
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-v1.0.0}"
          if [ -n "${{ inputs.version }}" ]; then VERSION="v${{ inputs.version }}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          bash ./gradlew :desktop:installDist -PradxVersion="$VERSION" --no-daemon --console=plain

      - name: Fetch the cores for the smoke test
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cores-linux"
          curl -sSL --retry 3 -o "$RUNNER_TEMP/sing-box.tar.gz" \
            "https://github.com/SagerNet/sing-box/releases/download/${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION#v}-linux-amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/sing-box.tar.gz" -C "$RUNNER_TEMP"
          install -m 0755 "$(find "$RUNNER_TEMP" -type f -name sing-box -path '*linux-amd64*' | head -1)" "$RUNNER_TEMP/cores-linux/sing-box"
          curl -sSL --retry 3 -o "$RUNNER_TEMP/xray.zip" \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip"
          unzip -o -q "$RUNNER_TEMP/xray.zip" -d "$RUNNER_TEMP/cores-linux"

      - name: Smoke-test the tool
        run: |
          set -euo pipefail
          export RADX_HOME="$RUNNER_TEMP/radxhome"
          RADX="desktop/build/install/radx/bin/radx"
          CORES="$RUNNER_TEMP/cores-linux"
          printf 'vless://3f1b9f4e-1234-4bcd-9a11-0d0e0f101112@127.0.0.1:18443?encryption=none&type=tcp&security=none#smoke\n' > "$RUNNER_TEMP/link.txt"
          "$RADX" import "$RUNNER_TEMP/link.txt" --name smoke
          "$RADX" list
          "$RADX" nodes
          "$RADX" gen --mode proxy --out "$RUNNER_TEMP/out" --cores "$CORES" --check | tee "$RUNNER_TEMP/gen.log"
          test -s "$RUNNER_TEMP/out/sing-box.json"
          # `gen --check` only verifies the config when it finds a core, so prove it did.
          grep -q "sing-box check -> OK" "$RUNNER_TEMP/gen.log" || {
            echo "::error::the tool did not verify the generated config with a real core"
            exit 1
          }

      - name: Fetch the Windows cores
        run: |
          set -euo pipefail
          DIST="desktop/build/install/radx"
          mkdir -p "$DIST/cores"
          curl -sSL --retry 3 -o "$RUNNER_TEMP/sing-box-win.zip" \
            "https://github.com/SagerNet/sing-box/releases/download/${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION#v}-windows-amd64.zip"
          unzip -o -q "$RUNNER_TEMP/sing-box-win.zip" -d "$RUNNER_TEMP/sing-box-win"
          install -m 0755 "$(find "$RUNNER_TEMP/sing-box-win" -name sing-box.exe | head -1)" "$DIST/cores/sing-box.exe"
          curl -sSL --retry 3 -o "$RUNNER_TEMP/xray-win.zip" \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-windows-64.zip"
          unzip -o -q "$RUNNER_TEMP/xray-win.zip" -d "$RUNNER_TEMP/xray-win"
          install -m 0755 "$RUNNER_TEMP/xray-win/xray.exe" "$DIST/cores/xray.exe"
          install -m 0755 "$RUNNER_TEMP/xray-win/wintun.dll" "$DIST/cores/wintun.dll"
          ls -la "$DIST/cores"

      - name: Package the Windows zip
        id: windows
        run: |
          set -euo pipefail
          OUT="Radx-Windows-${VERSION}.zip"
          (cd desktop/build/install && zip -r -q "$GITHUB_WORKSPACE/$OUT" radx)
          unzip -l "$OUT" | tail -5
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload the Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: radx-windows
          path: ${{ steps.windows.outputs.path }}

      - name: Attach the Windows zip to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$VERSION" "${{ steps.windows.outputs.path }}" --clobber
